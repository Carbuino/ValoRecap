<!DOCTYPE html>
<html>
    <head>
        <title>Vawowant</title>
        <style>
            @font-face {
              font-family: "tungsten";
              src: url("./fonts/Tungsten-Bold.ttf") format("truetype");
              font-weight: normal;
            }
            @font-face {
              font-family: "din-light";
              src: url("./fonts/DINNextW1G-Light.ttf") format("truetype");
            }
            @font-face {
              font-family: "din-regular";
              src: url("./fonts/DINNextW1G-Regular.ttf") format("truetype");
              font-weight: normal;
            }
            @font-face {
              font-family: "din-medium";
              src: url("./fonts/DINNextW1G-Medium.ttf") format("truetype");
              font-weight: bold;
            }
            @font-face {
              font-family: "din-bold";
              src: url("./fonts/DINNextW1G-Bold.ttf") format("truetype");
              font-weight: bolder;
            }
          </style>
      </head>
    <body>      
        <h1>Dropdown List Example</h1>

        <p>Select an option from the dropdown list to populate the text entry spaces:</p>

        <select id="dropdown" onchange="populateText()">
          <option value="option1">Left Agent</option>
          <option value="option2">Right Agent</option>
          <option value="option3">CenterLeft Agent</option>
          <option value="option4">CenterRight Agent</option>
          <option value="option5">Center Agent</option>
        </select>
      
        <br><br>
      
        <input type="text" id="text1" placeholder="Text 1">
        <input type="text" id="text2" placeholder="Text 2">
        <input type="text" id="text3" placeholder="Text 3">
        <input type="text" id="text4" placeholder="Text 4">
        <input type="text" id="rounW" placeholder="Green Wins">
        <input type="text" id="rounL" placeholder="Red Wins">

        <button onclick="retrieveText()">Populate Text</button>
        <button onclick="scrapeJSON('Carbon', '099')">Scape JSON</button>
        <script src="js/store.js"></script>
        <canvas id="myCanvas" width="1920" height="1080"></canvas>
        <script src="js/create_image.js"></script>
    </body>
</html>
